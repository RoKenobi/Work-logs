# Canonical entity registry for work-logs graph view.
#
# `kind`:
#   hardware  — physical robots, dev boards, sensors. Rendered as [[Wikilinks]].
#               A stub file is auto-created in logbook/entities/<name>.md so
#               the wikilink resolves to a real graph node.
#   platform  — orchestration platforms, fleet managers, dashboards. Same as
#               hardware (wikilinked + stub).
#   software  — languages, runtimes, libraries. Rendered as #tags.
#   protocol  — wire/transport protocols, RPC standards. Rendered as #tags.
#   concept   — abstract patterns, algorithms, design ideas. Rendered as #tags.
#
# `aliases` — alternate spellings the LLM might emit; matched
# case-insensitively. New entities proposed by the classifier are appended
# here only after user approval.

